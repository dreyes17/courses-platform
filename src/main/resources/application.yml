spring:
  application:
    name: courses

  # Requests, @RabbitListener consumers and the @Scheduled outbox relay run on virtual threads: the work is
  # I/O-bound (PostgreSQL, RabbitMQ), so a blocked call parks a cheap virtual thread instead of a pool thread.
  # The Hikari pool remains the real concurrency limit for database work. See README, "Virtual threads".
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/courses}
    username: ${SPRING_DATASOURCE_USERNAME:courses}
    password: ${SPRING_DATASOURCE_PASSWORD:courses}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  data:
    web:
      pageable:
        max-page-size: 100

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:courses}
    password: ${SPRING_RABBITMQ_PASSWORD:courses}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        # After the last retry the message is rejected without requeue, so the broker dead-letters it.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

app:
  jwt:
    # No default on purpose: the app refuses to start without a secret (>= 32 bytes) from the environment.
    secret: ${JWT_SECRET}
    ttl: 1h
  security:
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
  outbox:
    poll-interval: 500ms
    batch-size: 100
    confirm-timeout: 5s
  cache:
    # Upper bound on staleness for catalog reads; writes evict immediately (see CacheConfig).
    catalog-ttl: ${CACHE_CATALOG_TTL:10m}
    course-ttl: ${CACHE_COURSE_TTL:1m}
  payments:
    currency: EUR
    simulation:
      decline-above: 10000

management:
  # Actuator lives on its own port, which deployments keep inside their private network (see
  # docker-compose.yml). It needs no credentials there, so Prometheus and health probes can read it.
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Safe because the management port is never published outside the deployment network.
      show-details: always
      group:
        # Not ready to take traffic without its database or broker; liveness stays internal-only so a
        # dependency outage doesn't make the orchestrator restart a healthy process.
        readiness:
          include: readinessState,db,rabbit

logging:
  # Plain-text logs show the correlation id of the flow; JSON logs (logging.structured.format.console=ecs,
  # enabled in docker-compose.yml) include it as a field automatically.
  pattern:
    correlation: "[%X{correlationId:-}] "
