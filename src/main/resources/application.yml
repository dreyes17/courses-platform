spring:
  application:
    name: courses

  # Requests, @RabbitListener consumers and the @Scheduled outbox relay run on virtual threads: the work is
  # I/O-bound (PostgreSQL, RabbitMQ), so a blocked call parks a cheap virtual thread instead of a pool thread.
  # The Hikari pool remains the real concurrency limit for database work. See README, "Virtual threads".
  threads:
    virtual:
      enabled: true

  # MCP server (bonus): the same use cases as the REST API, exposed as tools for AI clients at /mcp and protected
  # by the same bearer token. Stateless: every tool call is one self-contained HTTP request, like the REST API,
  # so any instance can serve it and there is no MCP session to keep.
  ai:
    mcp:
      server:
        name: courses
        version: 1.0.0
        protocol: STATELESS
        type: SYNC
        instructions: >-
          Online course platform: catalog (categories, courses), students and enrollments. Every tool runs with
          the permissions of the bearer token sent with the request (ADMIN, INSTRUCTOR or STUDENT).
          Enrollments are confirmed asynchronously: enroll_student returns PENDING_PAYMENT and get_enrollment
          shows when it becomes ACTIVE.
        streamable-http:
          mcp-endpoint: /mcp

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/courses}
    username: ${SPRING_DATASOURCE_USERNAME:courses}
    password: ${SPRING_DATASOURCE_PASSWORD:courses}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  data:
    web:
      pageable:
        max-page-size: 100
    # Stores the rate-limit buckets, shared by every instance (see RedisBuckets).
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:courses}
    password: ${SPRING_RABBITMQ_PASSWORD:courses}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        # After the last retry the message is rejected without requeue, so the broker dead-letters it.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

app:
  jwt:
    # No default on purpose: the app refuses to start without a secret (>= 32 bytes) from the environment.
    secret: ${JWT_SECRET}
    ttl: 1h
  security:
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
  outbox:
    poll-interval: 500ms
    batch-size: 100
    confirm-timeout: 5s
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Bounds every check against Redis; past it the request is let through (fail-open) and counted.
    redis-timeout: 200ms
    # Per client IP: password guessing on login, account spam on registration.
    login:
      capacity: 10
      period: 1m
    registration:
      capacity: 20
      period: 1h
    # Per user: a client stuck retrying enrollments.
    enrollment:
      capacity: 30
      period: 1m
    # Per user: every MCP tool call (an agent looping over tools), enroll_student included.
    mcp:
      capacity: 120
      period: 1m
  cache:
    # Upper bound on staleness for catalog reads; writes evict immediately (see CacheConfig).
    catalog-ttl: ${CACHE_CATALOG_TTL:10m}
    course-ttl: ${CACHE_COURSE_TTL:1m}
  payments:
    currency: EUR
    simulation:
      decline-above: 10000

management:
  # Actuator lives on its own port, which deployments keep inside their private network (see
  # docker-compose.yml). It needs no credentials there, so Prometheus and health probes can read it.
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Safe because the management port is never published outside the deployment network.
      show-details: always
      group:
        # Not ready to take traffic without its database or broker; liveness stays internal-only so a
        # dependency outage doesn't make the orchestrator restart a healthy process.
        # Redis is left out on purpose: without it only rate limiting degrades (fail-open), so the instance can
        # keep serving traffic. It still shows in /actuator/health.
        readiness:
          include: readinessState,db,rabbit

logging:
  # Plain-text logs show the correlation id of the flow; JSON logs (logging.structured.format.console=ecs,
  # enabled in docker-compose.yml) include it as a field automatically.
  pattern:
    correlation: "[%X{correlationId:-}] "
