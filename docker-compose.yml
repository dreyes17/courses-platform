# Runs the whole platform: PostgreSQL, RabbitMQ, Redis, the application, and its observability stack (Prometheus,
# Jaeger and Grafana).
#   cp .env.example .env && docker compose up --build
# Secrets come only from the environment / .env (git-ignored); missing ones stop compose with an error.
name: courses

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: courses
      POSTGRES_USER: ${POSTGRES_USER:-courses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18+ keeps PGDATA in a versioned subdirectory, so mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-courses}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "15672:15672"   # management UI, to inspect queues and DLQs
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Stores the rate-limit buckets, so the limits hold across instances. Nothing else lives here, so no volume:
  # losing it only resets the counters.
  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: courses-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # Started first, but not required: without Redis only rate limiting degrades (fail-open).
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/courses
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-courses}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-courses}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (at least 32 bytes) in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      # One JSON object per log line (Elastic Common Schema), ready for a log collector.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      # Every request traced and exported over OTLP to Jaeger (the application default samples 10%).
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: "1.0"
    ports:
      - "8080:8080"   # API only
    # Actuator (health, info, prometheus) on 8081: reachable by other containers in this network
    # (the prometheus service below scrapes http://app:8081/actuator/prometheus) but deliberately not published.
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

  # Scrapes the app's management port and evaluates the alert rules in observability/prometheus/alerts.yml.
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      # Loopback only: the UI shows every metric, which the app keeps off the public network on purpose.
      - "127.0.0.1:9090:9090"

  # Receives the application's traces over OTLP (port 4318, internal only) and serves the trace UI. In-memory
  # storage: traces are lost on restart, which is fine for running the platform locally.
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    restart: unless-stopped
    environment:
      # Jaeger 2 listens on localhost by default; the application reaches it from another container.
      JAEGER_LISTEN_HOST: 0.0.0.0
    expose:
      - "4318"
    ports:
      - "127.0.0.1:16686:16686"   # trace UI, loopback only

  # Metrics dashboard over Prometheus (datasource and dashboard provisioned). Traces are browsed in Jaeger's UI.
  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # Read-only access without logging in, to look at the dashboard; editing needs the admin account.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/courses.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"     # loopback only, like Prometheus

volumes:
  postgres-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
