name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit, integration and HTTP tests. The integration tests start PostgreSQL and RabbitMQ with
      # Testcontainers, using the Docker daemon that ubuntu-latest runners already provide.
      - name: Build and run all tests
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  packaging:
    name: Docker image and deployment config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The same image `docker compose up --build` runs; it compiles with ./mvnw inside the build.
      - name: Build the application image
        run: docker build --tag courses-app .

      - name: Validate docker-compose.yml
        run: docker compose --env-file .env.example config --quiet

      - name: Validate the Prometheus config and alert rules
        run: >-
          docker run --rm --entrypoint promtool
          --volume "$PWD/observability/prometheus:/etc/prometheus:ro"
          prom/prometheus:v3.15.0 check config /etc/prometheus/prometheus.yml
