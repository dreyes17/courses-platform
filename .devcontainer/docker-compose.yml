# Development environment: the workspace container plus the infra the app needs.
# The application's own docker-compose.yml (a deliverable of the test) lives at the
# repo root and can be run from inside the devcontainer through Docker-in-Docker.
name: courses-dev

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/techlead:cached
      - m2-cache:/home/vscode/.m2
      - claude-config:/home/vscode/.claude
      # /tmp must be a Docker-managed mount: otherwise the docker-in-docker init script mounts a tmpfs
      # over it, hiding files that `docker cp` puts there (VS Code copies its server installer to /tmp).
      - dev-tmp:/tmp
    # Keeps the container alive; VS Code attaches to it.
    command: sleep infinity
    # Every value is ${VAR:-default}: override it in .devcontainer/.env or the host shell.
    # *_HOST / *_PORT only change where the app connects (e.g. an external server);
    # they don't reconfigure the postgres / rabbitmq / redis services below.
    environment:
      # Spring Boot relaxed binding picks these up, so `./mvnw spring-boot:run` works as-is.
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-courses}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-courses}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-courses}
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-courses}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-courses}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      # Dev-only signing secret; real deployments must inject their own (>= 256 bits).
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      # Dev-only bootstrap admin created on startup; real deployments inject their own.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@courses.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-dev-only-admin-password}
      # Used by the Postgres MCP server (see /.mcp.json).
      DATABASE_URI: postgresql://${POSTGRES_USER:-courses}:${POSTGRES_PASSWORD:-courses}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-courses}
      RABBITMQ_MANAGEMENT_URL: http://${RABBITMQ_HOST:-rabbitmq}:${RABBITMQ_MANAGEMENT_PORT:-15672}
      # Optional MCP credentials: read from the host shell or the git-ignored .devcontainer/.env.
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-courses}
      POSTGRES_USER: ${POSTGRES_USER:-courses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-courses}
    volumes:
      # PostgreSQL 18+ keeps PGDATA in a versioned subdirectory, so mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-courses}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-courses}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20

  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dev-tmp:
  m2-cache:
  claude-config:
  postgres-data:
  rabbitmq-data:
